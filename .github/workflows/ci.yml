name: SSO CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sso-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOFLAGS: -mod=readonly -p=4
      GOMAXPROCS: "4"
      GOMEMLIMIT: 6GiB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
      - name: Validate pinned upstream ancestry and dependency checksums
        run: |
          git merge-base --is-ancestor "$(jq -r .commit .stuhelper/upstream.json)" HEAD
          go mod verify
      - name: Run synthetic authentication and authorization regressions
        run: python3 .stuhelper/test-go.py
      - name: Compile every upstream test package
        run: go test -tags skipCi ./... -run '^$'
      - name: Build the complete server
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags='-w -s' -o "${RUNNER_TEMP}/casdoor" .
      - name: Validate automation policy and Git control-file isolation
        run: |
          python3 .stuhelper/test_automation.py
          python3 .stuhelper/test_registry_retention.py
      - name: Validate workflows
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  web:
    name: Web contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CYPRESS_INSTALL_BINARY: "0"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
      - name: Install pinned package manager
        run: npm install --global --ignore-scripts --no-audit --no-fund corepack@0.36.0 && corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      - name: Confirm the lockfile was not changed by the build
        run: git diff --exit-code -- package.json yarn.lock
